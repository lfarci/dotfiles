name: "Check test: bootstrap-vscode-extensions"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Bash assertions
        run: bash tests/bootstrap-vscode-extensions.bash

  powershell:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run PowerShell assertions
        shell: powershell
        run: .\tests\bootstrap-vscode-extensions.Tests.ps1
