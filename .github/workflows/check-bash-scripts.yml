name: Check Bash scripts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install from Ubuntu's signed package repositories rather than downloading
      # and executing an unverified release archive.
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck --version

      - name: Check maintained Bash scripts with ShellCheck
        run: |
          shellcheck \
            --severity=warning \
            bootstrap.sh \
            os/ubuntu/install.sh \
            os/fedora/install.sh \
            os/windows/install.sh \
            tests/bootstrap-vscode-extensions.bash \
            tests/fixtures/code-stub.bash
