name: Bootstrap checks

# Fast checks (Bash syntax + Bash/PowerShell extension tests) run automatically
# for pull requests and pushes to main. The expensive, network-dependent Docker
# installation jobs are opt-in: they run on the weekly schedule or when a manual
# run explicitly requests them. See docs/ci.md for the full execution policy.
on:
  workflow_dispatch:
    inputs:
      run_installation:
        description: Also run the expensive Docker installation jobs
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly safety net for the heavy installation jobs (Mondays 04:00 UTC).
    - cron: '0 4 * * 1'

# Cancel superseded runs for the same ref to keep fast feedback cheap.
concurrency:
  group: bootstrap-checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash-vscode-extensions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Bash syntax
        run: bash -n bootstrap.sh os/windows/install.sh os/ubuntu/install.sh os/fedora/install.sh

      - name: Test VS Code extension installer
        run: bash tests/bootstrap-vscode-extensions.bash

  powershell-vscode-extensions:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Test VS Code extension installer
        shell: powershell
        run: .\tests\bootstrap-vscode-extensions.Tests.ps1

  docker-bootstrap:
    # Expensive: only on the weekly schedule or an explicit manual request.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_installation)
    needs: [bash-vscode-extensions, powershell-vscode-extensions]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu, fedora, windows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image (${{ matrix.os }})
        run: |
          docker build \
            --build-arg REPO_URL="https://github.com/${{ github.repository }}" \
            --build-arg REPO_REF="${{ github.sha }}" \
            -f os/${{ matrix.os }}/Dockerfile \
            -t dotfiles-bootstrap-${{ matrix.os }} .
