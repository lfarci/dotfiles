name: Bootstrap installation checks

on:
  workflow_dispatch:
    inputs:
      run_installation:
        description: Run the expensive Docker installation jobs
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly safety net for the heavy installation jobs (Mondays 04:00 UTC).
    - cron: '0 4 * * 1'

# Cancel only superseded runs for the same event and ref.
concurrency:
  group: bootstrap-installation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Bash syntax
        run: bash -n bootstrap.sh os/windows/install.sh os/ubuntu/install.sh os/fedora/install.sh

      - name: Test VS Code extension installer
        run: bash tests/bootstrap-vscode-extensions.bash

      - name: Test skills restore staging
        run: bash tests/bootstrap-skills-restore.bash

      - name: Check skills inventory consistency
        run: bash tests/skills-inventory-consistency.bash

  powershell-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test VS Code extension installer
        shell: powershell
        run: .\tests\bootstrap-vscode-extensions.Tests.ps1

      - name: Check skills inventory consistency
        shell: powershell
        run: .\tests\skills-inventory-consistency.Tests.ps1

  docker-bootstrap:
    # Expensive: only on the weekly schedule or an explicit manual request.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_installation)
    needs: [bash-syntax]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu, fedora, windows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Docker image (${{ matrix.os }})
        run: |
          docker build \
            --build-arg REPO_URL="https://github.com/${{ github.repository }}" \
            --build-arg REPO_REF="${{ github.sha }}" \
            -f os/${{ matrix.os }}/Dockerfile \
            -t dotfiles-bootstrap-${{ matrix.os }} .
